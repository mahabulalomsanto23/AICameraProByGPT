name: Android build (OnePlus 8 installable APKs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android build configuration
        run: |
          grep -q 'version "8.6.1"' build.gradle.kts
          grep -q 'include("arm64-v8a")' app/build.gradle.kts
          grep -q 'signingConfigs.getByName("debug")' app/build.gradle.kts

      - name: Run lint and unit tests
        run: |
          gradle --no-daemon --stacktrace :app:lint
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug and release APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -size +0c -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -size +0c -print -quit)"
          echo "APK outputs:"
          ls -lh app/build/outputs/apk/*/*.apk

      - name: Upload OnePlus 8 APKs
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Pro-OnePlus8-debug-and-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
